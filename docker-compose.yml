  #     - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/smartbank
  #     - SECRET_KEY=your-secret-key-here
  #     - GEMINI_API_KEY=your-gemini-api-key-here
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app

  # frontend:
  #   build: ./frontend
  #   container_name: smartbank-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - VITE_API_URL=http://localhost:8000
