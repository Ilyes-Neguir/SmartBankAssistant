services:
  postgres:
    image: postgres:15
    container_name: smartbank-postgres
    environment:
      POSTGRES_DB: smartbank
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d smartbank"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment these services if you want to run everything in Docker
  # backend:
  #   build: ./backend
  #   container_name: smartbank-backend
  #   ports:
  #     - "8000:8000"
